<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Odłącz się! - Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- EKRAN STARTOWY -->

        <section id="start-screen">

            <h1>Odłącz się!</h1>

            <h2>Quiz o fonoholizmie</h2>

            <p>
                Sprawdź swoją wiedzę na temat zdrowego
                i świadomego korzystania ze smartfona.
            </p>

            <button id="start-btn">
                Rozpocznij quiz
            </button>

        </section>


        <!-- EKRAN QUIZU -->

        <section id="quiz-screen" style="display: none;">

            <div class="quiz-header">

                <p id="question-number">
                    Pytanie 1 z 14
                </p>

                <p id="score">
                    Punkty: 0
                </p>

            </div>


            <!-- PASEK POSTĘPU -->

            <div class="progress-container">

                <div id="progress-bar"></div>

            </div>


            <!-- PYTANIE -->

            <div class="question-box">

                <h2 id="question">
                    Tutaj pojawi się pytanie
                </h2>


                <!-- ODPOWIEDZI -->

                <div id="answers" class="answers-container">

                </div>

            </div>


            <!-- PRZYCISK NASTĘPNE -->

            <button id="next-btn" style="display: none;">
                Następne pytanie
            </button>

        </section>


        <!-- EKRAN WYNIKU -->

        <section id="result-screen" style="display: none;">

            <h1>Quiz zakończony!</h1>

            <p id="final-score"></p>

            <p id="result-message"></p>

            <button id="restart-btn">
                Zagraj ponownie
            </button>

        </section>

    </main>


    <script src="quizz.js"></script>

</body>

</html>
