<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Placeholder</title>
</head>
<body>
    <body>

    <main class="quiz-container">
        <section id="start-screen">
            <h1>Odłącz się!</h1>
            <h2>Quiz o fonoholizmie</h2>
            <p>
                Sprawdź swoją wiedzę na temat zdrowego korzystania
                ze smartfona i technologii.
            </p>
            <button id="start-btn">Rozpocznij quiz</button>
        </section>
        <section id="quiz-screen" style="display: none;">

            <div class="quiz-header">
                <p id="question-number">
                    Pytanie 1 z 12
                </p>
                <p id="score">
                    Punkty: 0
                </p>
            </div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div class="question-box">

                <h2 id="question">
                    Tutaj pojawi się pytanie
                </h2>

                <div id="answers" class="answers-container">

                    <button class="answer-btn">
                        Odpowiedź 1
                    </button>

                    <button class="answer-btn">
                        Odpowiedź 2
                    </button>

                </div>

            </div>

            <div id="feedback"></div>

            <button id="next-btn" style="display: none;">
                Następne pytanie
            </button>

        </section>

        <section id="result-screen" style="display: none;">
            <h1>Quiz zakończony!</h1>
            <p id="final-score"></p>
            <p id="result-message"></p>
            <button id="restart-btn">
                Spróbuj ponownie
            </button>
        </section>
    </main>

    <script src="quizz.js"></script>

</body>
</body>
</html>
